[package]
name = "slate-kv-hal"
version.workspace = true
edition.workspace = true
description = "Hardware abstraction traits (flash, monotonic counter, entropy, clock) for the SLATE key-value engine"
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/slate-kv-hal"
keywords = ["no-std", "embedded", "flash", "hal", "kv"]
categories = ["embedded", "no-std::no-alloc", "hardware-support"]

[dependencies]
embedded-storage-async = { version = "0.4.1", default-features = false, optional = true }

[features]
default = []
async = []
embedded-storage-async = ["async", "dep:embedded-storage-async"]
