[package]
name = "slate-kv-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true

[dependencies]
slate-kv-hal = { version = "0.3.3", path = "../slate-kv-hal" }
rand = { version = "0.8", features = ["small_rng"] }
