[package]
name = "slate-kv-sim"
version.workspace = true
edition.workspace = true
description = "Fault-injecting flash simulator and model-validation harness for the SLATE key-value engine"
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
# Development-only harness: it exists to turn the formal report's claims into
# CI-enforced tests, and has no stable API for downstream users.
publish = false

[dependencies]
slate-kv-hal.workspace = true
rand = { version = "0.8", features = ["small_rng"] }
proptest = "1.5"
slate-kv-core = { workspace = true, features = ["metrics"] }
slate-kv-crypto.workspace = true
slate-kv-erasure.workspace = true
# The std FileFlash/FileCounter engine, so the fault-characterisation examples
# can measure the file-backed path and the in-RAM SimFlash path side by side in
# one run. Dev-harness only: this crate is `publish = false`.
slate-kv.workspace = true
serde = { version = "1.0", features = ["derive"] }
# `getrusage` for the async-projection cost example: busy-polling can match
# wall-clock throughput while burning CPU, so both must be reported.
libc = "0.2"
