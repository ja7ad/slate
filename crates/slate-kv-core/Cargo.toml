[package]
name = "slate-kv-core"
version.workspace = true
edition.workspace = true
description = "Heapless no_std engine core for SLATE: append-only log, cuckoo index, hash chain, epochs and GC"
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/slate-kv-core"
keywords = ["key-value", "no-std", "embedded", "database", "heapless"]
categories = [
    "database-implementations",
    "embedded",
    "no-std::no-alloc",
    "data-structures",
]

[dependencies]
slate-kv-hal.workspace = true
slate-kv-erasure.workspace = true
sha2 = { version = "0.11.0", default-features = false }
heapless = "0.8.0"

[features]
default = ["blocking"]
blocking = []                                 # sync façade via block_on — today's API
async = ["slate-kv-hal/async"]
# Off by default so the bare-metal build pays nothing: enables the `metrics`
# counters (commits, wakes, bytes programmed, erases) used by the energy model.
metrics = []
dbgtrace = []   # TEMPORARY: host-only allocator tracing; pulls in std

[package.metadata.docs.rs]
all-features = true
