name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal -c rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal -c clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: cargo test --workspace

  nostd:
    name: No-Std Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target thumbv7em-none-eabihf
      - run: cargo build -p slate-core -p slate-hal -p slate-crypto -p slate-erasure --no-default-features --target thumbv7em-none-eabihf

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  miri:
    name: Miri
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal -c miri
      - run: rustup default nightly
      - run: cargo miri test -p slate-core

  qemu-sim:
    name: QEMU Crash Simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target riscv32imc-unknown-none-elf
      - name: Install espflash
        run: cargo install espflash cargo-binutils
      - name: Install Espressif QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-2.0-0 libslirp0 libglib2.0-0 libpixman-1-0 libgcrypt20
          wget https://github.com/espressif/qemu/releases/download/esp-develop-9.2.2-20260417/qemu-riscv32-softmmu-esp_develop_9.2.2_20260417-x86_64-linux-gnu.tar.xz
          tar -xf qemu-riscv32-softmmu-esp_develop_9.2.2_20260417-x86_64-linux-gnu.tar.xz
          echo "$PWD/qemu/bin" >> $GITHUB_PATH
      - name: Run QEMU Crash Suite (None)
        run: ./targets/esp32/scripts/qemu_crash.sh --iters 25 --attack none
      - name: Run QEMU Crash Suite (Rollback)
        run: ./targets/esp32/scripts/qemu_crash.sh --iters 2 --attack rollback
      - name: Run QEMU Crash Suite (Tamper)
        run: ./targets/esp32/scripts/qemu_crash.sh --iters 2 --attack tamper

  wokwi-sim:
    name: Wokwi Simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target riscv32imc-unknown-none-elf
      - name: Install Wokwi CLI
        run: curl -L https://wokwi.com/ci/install.sh | sh
      - name: Run Wokwi scenario
        run: |
          cd targets/esp32
          cargo build --release --no-default-features --features chip-esp32c3,counter-flash --bin kv_demo --target riscv32imc-unknown-none-elf
          if [ -z "$WOKWI_CLI_TOKEN" ]; then
            echo "WOKWI_CLI_TOKEN is empty. Skipping Wokwi simulation."
            exit 0
          fi
          wokwi-cli --timeout 60000 --scenario wokwi/kv_demo.scenario.yaml .
        env:
          WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN || vars.WOKWI_CLI_TOKEN }}
