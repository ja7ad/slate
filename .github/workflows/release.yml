name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          TAG="${GITHUB_REF_NAME#v}"
          echo "manifest=$VERSION tag=$TAG"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-esp32:
    name: Build ${{ matrix.chip }} Firmware
    runs-on: ubuntu-latest
    needs: [verify-version]
    # One leg per chip SLATE supports, replacing the single ESP32-C3 build.
    # The chip list is the intersection of esp-hal and esp-storage support:
    # SLATE needs the flash backend, so a chip the HAL alone covers is not
    # enough. espflash 4.5.0 can `save-image` for all nine.
    #
    # `fail-fast: false` so one chip's failure does not cancel the other eight
    # and leave a release with a partial artifact set.
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: esp32c2
            target: riscv32imc-unknown-none-elf
            arch: riscv
          - chip: esp32c3
            target: riscv32imc-unknown-none-elf
            arch: riscv
          - chip: esp32c5
            target: riscv32imac-unknown-none-elf
            arch: riscv
          - chip: esp32c6
            target: riscv32imac-unknown-none-elf
            arch: riscv
          - chip: esp32c61
            target: riscv32imac-unknown-none-elf
            arch: riscv
          - chip: esp32h2
            target: riscv32imac-unknown-none-elf
            arch: riscv
          - chip: esp32
            target: xtensa-esp32-none-elf
            arch: xtensa
          - chip: esp32s2
            target: xtensa-esp32s2-none-elf
            arch: xtensa
          - chip: esp32s3
            target: xtensa-esp32s3-none-elf
            arch: xtensa
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target (RISC-V)
        if: matrix.arch == 'riscv'
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      # Xtensa has no upstream rustc target: it needs the espup fork. Note the
      # release assets are BARE BINARIES, not archives -- fetching a .tar.xz
      # name that does not exist yields a 9-byte error page that tar rejects.
      - name: Install Xtensa toolchain
        if: matrix.arch == 'xtensa'
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/espup \
            https://github.com/esp-rs/espup/releases/latest/download/espup-x86_64-unknown-linux-gnu
          chmod +x /tmp/espup
          /tmp/espup install --targets ${{ matrix.chip }} --export-file "$HOME/export-esp.sh"
      # Prebuilt binary: `cargo install espflash` compiles from source and cost
      # minutes on every release.
      - name: Install espflash (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: espflash
      - name: Build ${{ matrix.chip }} Firmware
        run: |
          set -euo pipefail
          # Portable SHA-256. No single tool is present on all three runner
          # images: macOS has `shasum` but not `sha256sum`, Linux has both, and
          # Windows (Git Bash) has NEITHER -- `shasum: command not found` is
          # what failed the windows-latest leg after it had already packaged
          # every file correctly. Python 3 ships on all three, so it is the
          # backstop. All three paths emit the same "<hash>  <name>" format, so
          # the .sha256 file verifies with `sha256sum -c` regardless of which
          # ran.
          sha256_of() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1"
            elif command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$1"
            else
              python3 -c "
          import hashlib, sys
          h = hashlib.sha256()
          with open(sys.argv[1], 'rb') as f:
              for chunk in iter(lambda: f.read(1 << 20), b''):
                  h.update(chunk)
          print(h.hexdigest() + '  ' + sys.argv[1])
          " "$1"
            fi
          }
          CHIP="${{ matrix.chip }}"
          TARGET_TRIPLE="${{ matrix.target }}"
          IMG="slate-${CHIP}-flash.img"

          cd targets/esp32
          # Xtensa needs the espup toolchain and `-Z build-std=core,alloc`: the
          # fork ships rust-src but no precompiled `core` for xtensa-*-none-elf,
          # so a plain build dies with `can't find crate for core` on the first
          # no_std dependency.
          if [ "${{ matrix.arch }}" = "xtensa" ]; then
            . "$HOME/export-esp.sh"
            rustup run esp cargo build --release --bin kv_demo --no-default-features \
              --features "chip-${CHIP},counter-flash" --target "$TARGET_TRIPLE" \
              -Z build-std=core,alloc
          else
            cargo build --release --bin kv_demo --no-default-features \
              --features "chip-${CHIP},counter-flash" --target "$TARGET_TRIPLE"
          fi

          espflash save-image --ignore-app-descriptor --merge --chip "$CHIP" \
            "target/${TARGET_TRIPLE}/release/kv_demo" "$IMG"

          # The image must be exactly 4 MiB and padded with 0xFF, the NOR erased
          # state. `truncate` pads with 0x00, which EspFlash::program() rejects
          # as ProgramWithoutErase — a previously released image failed on the
          # first write past the firmware for exactly that reason, and
          # scripts/qemu_run.sh documents the trap.
          #
          # espflash 4.5.0's `--merge` already emits a full 4 MiB with 0xFF
          # padding (verified locally for esp32, esp32c6 and esp32s3), so this
          # is normally a no-op. It is kept because the guarantee is espflash's,
          # not ours: a version that stops padding must fail the release rather
          # than ship an image that bricks on first write.
          CURRENT=$(wc -c < "$IMG" | tr -d ' ')
          TARGET_SIZE=4194304
          if [ "$CURRENT" -gt "$TARGET_SIZE" ]; then
            echo "::error::image is $CURRENT B, larger than the 4 MiB flash"
            exit 1
          fi
          if [ "$CURRENT" -lt "$TARGET_SIZE" ]; then
            python3 -c "import sys; sys.stdout.buffer.write(b'\xff' * ($TARGET_SIZE - $CURRENT))" \
              >> "$IMG"
          fi
          # Assert the padding really is 0xFF before shipping it.
          IMG="$IMG" python3 - <<'PY'
          import os
          path = os.environ["IMG"]
          data = open(path, "rb").read()
          assert len(data) == 4194304, len(data)
          tail = data[-4096:]
          assert set(tail) == {0xFF}, f"padding is not 0xFF: {sorted(set(tail))[:8]}"
          print(f"{path} OK: 4 MiB, tail padded with 0xFF")
          PY

          cp ../../LICENSE-MIT ../../LICENSE-APACHE .
          tar -czf "slate-${CHIP}-${{ github.ref_name }}.tar.gz" \
            "$IMG" \
            "target/${TARGET_TRIPLE}/release/kv_demo" \
            LICENSE-MIT LICENSE-APACHE
          sha256_of "slate-${CHIP}-${{ github.ref_name }}.tar.gz" \
            > "slate-${CHIP}-${{ github.ref_name }}.tar.gz.sha256"
      - name: Upload ESP32 Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            targets/esp32/slate-${{ matrix.chip }}-${{ github.ref_name }}.tar.gz
            targets/esp32/slate-${{ matrix.chip }}-${{ github.ref_name }}.tar.gz.sha256

  build-rp2040:
    name: Build RP2040 Firmware
    runs-on: ubuntu-latest
    needs: [verify-version]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        run: rustup toolchain install stable --profile minimal --target thumbv6m-none-eabi
      # UF2 is the artifact a Pico user actually wants: hold BOOTSEL, drag the
      # file onto the RPI-RP2 mass-storage volume, done. Shipping only an ELF
      # would make every user install a converter first.
      - name: Install elf2uf2-rs (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: elf2uf2-rs
      - name: Build and package RP2040 firmware
        run: |
          set -euo pipefail
          sha256_of() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1"
            elif command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$1"
            else
              python3 -c "
          import hashlib, sys
          h = hashlib.sha256()
          with open(sys.argv[1], 'rb') as f:
              for chunk in iter(lambda: f.read(1 << 20), b''):
                  h.update(chunk)
          print(h.hexdigest() + '  ' + sys.argv[1])
          " "$1"
            fi
          }
          cd targets/rp2
          cargo build --release --bin kv_demo
          ELF=target/thumbv6m-none-eabi/release/kv_demo
          elf2uf2-rs "$ELF" slate-rp2040.uf2

          # Verify the UF2 rather than trusting the converter's exit code: a
          # malformed file fails silently at drag-and-drop time with no
          # diagnostic on the board.
          python3 - <<'PY'
          import struct
          d = open("slate-rp2040.uf2", "rb").read()
          assert len(d) % 512 == 0, f"UF2 must be whole 512 B blocks, got {len(d)}"
          magic0, magic1 = struct.unpack("<II", d[:8])
          final = struct.unpack("<I", d[508:512])[0]
          family = struct.unpack("<I", d[28:32])[0]
          assert magic0 == 0x0A324655, hex(magic0)
          assert magic1 == 0x9E5D5157, hex(magic1)
          assert final == 0x0AB16F30, hex(final)
          # 0xE48BFF56 is the RP2040 family id. A wrong id makes the bootloader
          # reject the drop without saying why.
          assert family == 0xE48BFF56, f"family {family:#x} is not RP2040"
          print(f"UF2 OK: {len(d)//512} blocks, family {family:#x}")
          PY

          cp ../../LICENSE-MIT ../../LICENSE-APACHE .
          cat > README.txt <<'EOF'
          SLATE RP2040 (Raspberry Pi Pico) firmware
          =========================================
          slate-rp2040.uf2   drag-and-drop image: hold BOOTSEL while plugging the
                             board in, then copy this onto the RPI-RP2 volume
          kv_demo            the ELF, for probe-rs / gdb / picotool

          The demo speaks a UART shell on GP0 (TX) / GP1 (RX) at 115200 8N1, with
          the same command set as the ESP32 firmware: put, get, del, commit,
          seal, compact, stats, health, mode, selftest.

          The SLATE region defaults to 1 MiB at flash offset 0x100000, clearing
          the program image. The rollback counter is BestEffort: it survives
          reboot, but the RP2040 has no hardware monotonic counter, so an
          attacker with physical flash access can roll it back. Treat
          SLATE_ERR_TAMPERED and SLATE_ERR_ROLLBACK as distinct security
          failures — never retry or flatten them into a generic I/O error.

          Full specification: docs/specification.md in the source repository,
          https://github.com/ja7ad/slate
          EOF
          tar -czf "slate-rp2040-${{ github.ref_name }}.tar.gz" \
            slate-rp2040.uf2 "$ELF" README.txt LICENSE-MIT LICENSE-APACHE
          sha256_of "slate-rp2040-${{ github.ref_name }}.tar.gz" \
            > "slate-rp2040-${{ github.ref_name }}.tar.gz.sha256"
      - name: Upload RP2040 Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            targets/rp2/slate-rp2040-${{ github.ref_name }}.tar.gz
            targets/rp2/slate-rp2040-${{ github.ref_name }}.tar.gz.sha256

  build-ffi:
    name: Build C FFI (${{ matrix.asset_name }})
    runs-on: ${{ matrix.os }}
    needs: [verify-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: slate-kv-ffi-linux-amd64
          # Linux arm64 covers Raspberry Pi class boards, which the README names
          # as a target platform and which had no release artifact at all.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_name: slate-kv-ffi-linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: slate-kv-ffi-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: slate-kv-ffi-windows-amd64
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - name: Build FFI Library
        run: cargo build --release -p slate-kv-ffi --target ${{ matrix.target }}
      # The staticlib carries no system libraries, so a consumer needs the
      # platform link line. Capture it per target and ship it — otherwise every
      # user rediscovers it from linker errors.
      - name: Record native link requirements
        shell: bash
        run: |
          cargo rustc -p slate-kv-ffi --release --target ${{ matrix.target }} \
            --crate-type staticlib -- --print native-static-libs \
            2>&1 | grep -i 'native-static-libs' | tail -1 > native-libs.txt || true
          cat native-libs.txt || true
      - name: Package FFI Artifacts
        shell: bash
        run: |
          set -euo pipefail
          # Portable SHA-256. No single tool is present on all three runner
          # images: macOS has `shasum` but not `sha256sum`, Linux has both, and
          # Windows (Git Bash) has NEITHER -- `shasum: command not found` is
          # what failed the windows-latest leg after it had already packaged
          # every file correctly. Python 3 ships on all three, so it is the
          # backstop. All three paths emit the same "<hash>  <name>" format, so
          # the .sha256 file verifies with `sha256sum -c` regardless of which
          # ran.
          sha256_of() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1"
            elif command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$1"
            else
              python3 -c "
          import hashlib, sys
          h = hashlib.sha256()
          with open(sys.argv[1], 'rb') as f:
              for chunk in iter(lambda: f.read(1 << 20), b''):
                  h.update(chunk)
          print(h.hexdigest() + '  ' + sys.argv[1])
          " "$1"
            fi
          }
          OUT="target/${{ matrix.target }}/release"
          mkdir -p dist/include dist/lib
          cp crates/slate-kv-ffi/include/slate.h dist/include/
          cp LICENSE-MIT LICENSE-APACHE dist/
          # Copy each library extension explicitly. The previous
          # `cp libslate_kv_ffi.* … 2>/dev/null || true` swallowed every error,
          # so a build that produced no library still uploaded a tarball
          # containing only a header — and shipped the .d dependency file when
          # it did work. `found` makes an empty lib/ a hard failure.
          found=0
          for ext in a so dylib lib dll dll.lib pdb; do
            for base in libslate_kv_ffi slate_kv_ffi; do
              f="$OUT/$base.$ext"
              if [ -f "$f" ]; then cp "$f" dist/lib/; found=1; fi
            done
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no FFI library produced in $OUT"
            ls -la "$OUT" || true
            exit 1
          fi
          [ -f native-libs.txt ] && cp native-libs.txt dist/ || true
          cat > dist/README.txt <<'EOF'
          SLATE C ABI release artifact
          ============================
          include/slate.h        C header (generated by cbindgen)
          lib/                   static and shared libraries for this platform
          native-libs.txt        system libraries the STATIC lib must link against
          LICENSE-MIT, LICENSE-APACHE

          Linking
          -------
          Shared: link the .so/.dylib/.dll and ensure it is on the runtime
          search path (LD_LIBRARY_PATH / DYLD_LIBRARY_PATH / PATH).
          Static: link the .a/.lib PLUS the system libraries listed in
          native-libs.txt — Rust static libraries do not bundle them.

          On Windows, lib/ holds four files and the names are easy to confuse:
            slate_kv_ffi.dll        the shared library — ship this next to your
                                    executable, or put it on PATH
            slate_kv_ffi.dll.lib    the IMPORT library for that DLL — link this
                                    when you want the shared library
            slate_kv_ffi.lib        the STATIC library — link this instead if
                                    you want no DLL at runtime
            slate_kv_ffi.pdb        debug symbols, optional; keep it beside the
                                    DLL if you want readable stack traces in a
                                    crash dump. Not needed to build or run.

          Note the distinction between .dll.lib and .lib: linking the wrong one
          either leaves you needing a DLL you did not ship, or statically links
          a copy you did not intend.

          Before use, check slate_abi_version() against the header's
          SLATE_ABI_VERSION_MAJOR / _MINOR.

          Treat SLATE_ERR_TAMPERED (-10) and SLATE_ERR_ROLLBACK (-11) as
          distinct security failures. Never retry or flatten them into a
          generic I/O error.

          Full specification: docs/specification.md in the source repository,
          https://github.com/ja7ad/slate
          EOF
          echo "=== packaged ==="; find dist -type f | sort
          tar -czf "${{ matrix.asset_name }}-${{ github.ref_name }}.tar.gz" -C dist .
          sha256_of "${{ matrix.asset_name }}-${{ github.ref_name }}.tar.gz" \
            > "${{ matrix.asset_name }}-${{ github.ref_name }}.tar.gz.sha256"
      # Prove the artifact is usable rather than merely present: compile and run
      # the C smoke test against the packaged header and static library.
      - name: Verify artifact links and runs (Unix)
        if: matrix.os != 'windows-latest' && !contains(matrix.target, 'aarch64-unknown-linux')
        shell: bash
        run: |
          set -euo pipefail
          LIBS=$(sed -E 's/.*native-static-libs: *//' native-libs.txt 2>/dev/null || true)
          cc -Idist/include crates/slate-kv-ffi/tests/ffi_smoke.c \
             dist/lib/libslate_kv_ffi.a $LIBS -o smoke
          ./smoke
      - name: Upload FFI Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name }}-${{ github.ref_name }}.tar.gz
            ${{ matrix.asset_name }}-${{ github.ref_name }}.tar.gz.sha256

  publish-crates:
    name: Publish crates.io release
    runs-on: ubuntu-latest
    # Publishing is irreversible — a crates.io version can be yanked but never
    # replaced. Gate it on the tag/manifest check and on the artifacts actually
    # building, so a broken release fails before anything is published.
    # `build-esp32` is now a 9-leg matrix and `build-rp2040` is new; both are
    # gates. Publishing is irreversible, so a firmware that no longer builds
    # must stop the release before anything reaches crates.io.
    needs: [verify-version, build-ffi, build-esp32, build-rp2040]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Publish workspace crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "Publishing workspace version ${VERSION}"

          # crates.io's web API (crates.io/api/v1/...) enforces a crawler policy
          # that 403s any request without a descriptive User-Agent, independent
          # of whether the crate/version exists. index.crates.io (the sparse
          # index cargo itself reads to resolve dependencies) has no such
          # requirement, and is the thing that actually gates whether the next
          # crate's `cargo publish` can resolve this one as a dependency - so
          # poll that directly instead of the web API.
          USER_AGENT="slate-release-ci (${VERSION}; +https://github.com/ja7ad/slate)"

          sparse_index_url() {
            local name
            name=$(echo "$1" | tr '[:upper:]' '[:lower:]')
            local len=${#name}
            if [ "$len" -eq 1 ]; then
              echo "https://index.crates.io/1/${name}"
            elif [ "$len" -eq 2 ]; then
              echo "https://index.crates.io/2/${name}"
            elif [ "$len" -eq 3 ]; then
              echo "https://index.crates.io/3/${name:0:1}/${name}"
            else
              echo "https://index.crates.io/${name:0:2}/${name:2:2}/${name}"
            fi
          }

          is_indexed() {
            local name="$1"
            curl -sf -A "$USER_AGENT" "$(sparse_index_url "$name")" \
              | grep -q "\"vers\":\"${VERSION}\""
          }

          publish_crate() {
            local name="$1"
            if is_indexed "$name"; then
              echo "${name} ${VERSION} is already published, skipping"
              return
            fi
            echo "Publishing ${name} ${VERSION}"
            cargo publish -p "${name}" --locked
            echo "Waiting for ${name} ${VERSION} to be indexed on crates.io..."
            for _ in $(seq 1 60); do
              if is_indexed "$name"; then
                echo "${name} ${VERSION} is live"
                return
              fi
              sleep 10
            done
            echo "Timed out waiting for ${name} ${VERSION} to be indexed" >&2
            exit 1
          }

          # Dependency order matters: a crate can only publish once every
          # path-dependency it points at is already live on crates.io.
          publish_crate slate-kv-hal
          publish_crate slate-kv-erasure
          publish_crate slate-kv-core
          publish_crate slate-kv-crypto
          publish_crate slate-kv
          publish_crate slate-kv-cli
