[package]
name = "slate-esp32"
version = "0.4.0"
edition = "2021"
description = "Bare-metal ESP32 port of SLATE: esp-hal flash/counter backends, demo and benchmark firmware"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/ja7ad/slate"
homepage = "https://github.com/ja7ad/slate"
# Firmware, not a library: built from this directory with a RISC-V/Xtensa target
# and its own `.cargo/config.toml`, so it is excluded from the root workspace.
publish = false

[dependencies]
slate-kv-core = { path = "../../crates/slate-kv-core" }
slate-kv-hal = { path = "../../crates/slate-kv-hal" }
slate-kv-crypto = { path = "../../crates/slate-kv-crypto" }

esp-hal = { version = "1.1.1", default-features = false }
esp-backtrace = { version = "0.19.0", features = ["panic-handler", "println"] }
esp-println = { version = "0.17.0" }
esp-storage = { version = "0.9.0" }
embedded-storage = "0.3.1"
esp-bootloader-esp-idf = "0.5.0"
critical-section = "1.2.0"

[features]
default = []
chip-esp32c3 = ["esp-hal/esp32c3", "esp-hal/rt", "esp-backtrace/esp32c3", "esp-println/esp32c3", "esp-storage/esp32c3", "esp-bootloader-esp-idf/esp32c3"]
counter-flash = []
counter-efuse = []
counter-none = []
metrics = ["slate-kv-core/metrics"]
