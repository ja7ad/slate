version: 1
name: "KV Demo ESP32-C3"
author: "Slate"
description: "Verify kv_demo runs on C3 in wokwi"
steps:
  - wait-serial: "slate> "
  - write-serial: "put a 1\n"
  - wait-serial: "slate> "
  - write-serial: "get a\n"
  - wait-serial: "get a"
  - wait-serial: "slate> "
  - write-serial: "del a\n"
  - wait-serial: "slate> "
  - write-serial: "get a\n"
  - wait-serial: "get a"
  - wait-serial: "slate> "
  - write-serial: "commit\n"
  - wait-serial: "ack 1"
  - wait-serial: "slate> "
  - write-serial: "mode\n"
  - wait-serial: "BestEffortRollback"
  - wait-serial: "slate> "
  - write-serial: "stats\n"
  - wait-serial: "stats:"
