version: 1
name: "KV Demo ESP32-C3"
author: "Slate"
description: "Verify kv_demo runs on C3 in wokwi"
steps:
  - wait-for: "Booting kv_demo..."
  - wait-for: "slate> "
  - send: "put a 1\n"
  - wait-for: "slate> "
  - send: "get a\n"
  - wait-for: "get a"
  - wait-for: "slate> "
  - send: "del a\n"
  - wait-for: "slate> "
  - send: "get a\n"
  - wait-for: "get a"
  - wait-for: "slate> "
  - send: "commit\n"
  - wait-for: "ack 1"
  - wait-for: "slate> "
  - send: "mode\n"
  - wait-for: "BestEffortRollback"
  - wait-for: "slate> "
  - send: "stats\n"
  - wait-for: "stats:"
  - expect-pass
