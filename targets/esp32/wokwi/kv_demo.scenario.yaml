version: 1
name: "KV Demo ESP32-C3"
author: "Slate"
description: "Smoke test: boot, REPL prompt, basic commands on C3 in Wokwi"
steps:
  - wait-serial: "slate> "
  - write-serial: "selftest\n"
  - wait-serial: "Format"
  - wait-serial: "slate> "
  - write-serial: "mode\n"
  - wait-serial: "None"
  - wait-serial: "slate> "
  - write-serial: "stats\n"
  - wait-serial: "stats:"
  - wait-serial: "slate> "
  - write-serial: "put a 1\n"
  - wait-serial: "slate> "
  - write-serial: "commit\n"
  - wait-serial: "ack 1"
